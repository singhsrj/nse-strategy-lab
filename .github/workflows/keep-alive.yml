# Pings the Render free-tier service so it doesn't sleep after 15 minutes idle.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 120 --retry 3 https://nse-strategy-lab-c9z7.onrender.com/api/strategies -o /dev/null
